[build]
  publish = "out"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=43200"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/formats"
  to = "/file-extension"
  status = 301
  force = true

[[redirects]]
  from = "/formats/*"
  to = "/file-extension/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tools/discovery/city-weather"
  to = "/city"
  status = 301
  force = true

[[redirects]]
  from = "/tools/discovery/country-facts"
  to = "/country"
  status = 301
